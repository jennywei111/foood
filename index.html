<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小鍋日記｜兩個人的快煮鍋餐桌</title>
<meta name="description" content="快煮鍋一人份菜單日曆：排菜、對照冰箱、一鍵列出本週所需食材。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F2F3; --surface:#FFFFFF; --ink:#2E2A33; --ink-soft:#77707C; --rule:#E4DADD;
  --blush:#F1CFCA; --blush-deep:#D98F88; --sage:#C6D6C3; --sage-deep:#6F8D72;
  --powder:#CCDAE8; --butter:#F2E2B4; --lav:#DCD3E8;
  --night:#2A2630; --night-ink:#F7F2F3; --night-soft:#BDB3C2;
  --on-ink:#FFFFFF;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --latin:"Cormorant Garamond","Noto Serif TC",serif;
  --arch:999px 999px 14px 14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1B22; --surface:#29252E; --ink:#F3EDF0; --ink-soft:#ADA4B1; --rule:#3B3540;
    --blush:#5A3D40; --blush-deep:#E3A39C; --sage:#34443A; --sage-deep:#9DBC9F;
    --powder:#33404D; --butter:#4A4230; --lav:#3E3649;
    --night:#141217; --night-ink:#F3EDF0; --night-soft:#A79EAB; --on-ink:#1E1B22;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1B22; --surface:#29252E; --ink:#F3EDF0; --ink-soft:#ADA4B1; --rule:#3B3540;
  --blush:#5A3D40; --blush-deep:#E3A39C; --sage:#34443A; --sage-deep:#9DBC9F;
  --powder:#33404D; --butter:#4A4230; --lav:#3E3649;
  --night:#141217; --night-ink:#F3EDF0; --night-soft:#A79EAB; --on-ink:#1E1B22;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--blush-deep);outline-offset:3px}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;letter-spacing:.04em;margin:0}

/* ---------- 頂部導覽 ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--night);color:var(--night-ink);border-bottom:1px solid rgba(255,255,255,.08)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-family:var(--serif);font-size:17px;letter-spacing:.55em;white-space:nowrap;margin-right:-.55em;background:none;border:0;padding:0;color:inherit}
.links{display:flex;gap:4px}
.links button{background:none;border:0;padding:6px 10px;font-size:14.5px;letter-spacing:.12em;color:var(--night-soft);border-bottom:1px solid transparent;border-radius:0}
.links button[aria-current="page"]{color:var(--night-ink);border-bottom-color:var(--blush)}
.navr{display:flex;align-items:center;gap:6px}
.acct{position:relative;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--night-ink);font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.acct:hover{border-color:var(--night-ink)}
.acct::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--night);display:none}
.acct[data-s="synced"]::after{display:block;background:#8FC79A}
.acct[data-s="syncing"]::after{display:block;background:#F2D27A}
.acct[data-s="error"]::after{display:block;background:#E48A80}
.acct[data-s="signedout"]::after,.acct[data-s="noconfig"]::after{display:block;background:#8E8795}
.cloud-card{margin-top:18px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--rule)}
.cloud-card p{margin:0 0 10px}
.cloud-card code{font-size:13px;background:var(--paper);padding:1px 6px;border-radius:6px}
.gbtn{display:inline-flex;align-items:center;gap:10px}
@media (max-width:420px){.brand{letter-spacing:.2em;font-size:15px;margin-right:0}.links button{padding:6px 5px;font-size:13px;letter-spacing:.02em}}

/* ---------- 深色主視覺（美食攝影感） ---------- */
.hero{background:var(--night);color:var(--night-ink);padding:36px 0 44px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.kicker{font-family:var(--latin);font-style:italic;font-size:19px;color:var(--blush);letter-spacing:.06em;margin:0 0 6px}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.25;letter-spacing:.08em}
.hero .lede{color:var(--night-soft);margin:14px 0 0;max-width:30em}
.today-line{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.today-line strong{font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:.06em}
.today-line span{color:var(--night-soft);font-size:14px}
.arch-frame{border-radius:var(--arch);overflow:hidden;aspect-ratio:5/6;max-width:360px;width:100%;justify-self:end;background:var(--blush)}
.arch-frame svg{display:block;width:100%;height:100%}
@media (max-width:760px){
  .hero{padding:26px 0 30px}
  .hero .wrap{grid-template-columns:1fr 120px;gap:18px}
  .arch-frame{max-width:120px}
  .hero .lede{font-size:14.5px}
}

/* ---------- 按鈕 ---------- */
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 22px;font-size:14.5px;letter-spacing:.08em;transition:background .15s,color .15s}
.btn:hover{background:var(--ink);color:var(--on-ink)}
.btn.solid{background:var(--ink);color:var(--on-ink)}
.btn.solid:hover{opacity:.85}
.btn.soft{border-color:transparent;background:var(--blush)}
.btn.soft:hover{background:var(--blush-deep);color:#fff}
.btn.sm{padding:5px 14px;font-size:13.5px}
.btn.light{border-color:var(--night-ink);color:var(--night-ink)}
.btn.light:hover{background:var(--night-ink);color:var(--night)}
.btn.light.solid{background:var(--blush);border-color:var(--blush);color:#2E2A33}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- 區塊標題 ---------- */
.section{padding-top:44px;padding-bottom:8px}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.shead h2{font-size:clamp(24px,3.4vw,32px);line-height:1.3}
.shead .num{font-family:var(--latin);font-style:italic;font-size:18px;color:var(--ink-soft)}
.shead p{margin:0;color:var(--ink-soft);font-size:14px}

/* ---------- 首頁兩欄 ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:860px){.home-grid{grid-template-columns:1fr;gap:10px}}

/* 日曆 */
.cal{background:var(--surface);border-radius:22px;padding:22px 20px 18px;border:1px solid var(--rule)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{font-size:22px;letter-spacing:.1em}
.round{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:transparent;font-size:18px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.round:hover{border-color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 4px}
.dow{text-align:center;font-size:12.5px;color:var(--ink-soft);letter-spacing:.1em;padding-bottom:6px}
.day{position:relative;border:0;background:transparent;border-radius:var(--arch);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;min-width:0;min-height:58px}
.day .n{font-size:15px;line-height:1.6;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.day .e{font-size:12.5px;line-height:1.2;letter-spacing:-2px;white-space:nowrap;overflow:hidden;max-width:100%;min-height:15px}
.day.out{opacity:.35}
.day.wk{background:var(--sage)}
.day.today .n{background:var(--blush-deep);color:#fff}
.day.sel{background:var(--ink);color:var(--on-ink)}
.day.sel.today .n{background:var(--blush);color:#2E2A33}
.day:hover:not(.sel){background:var(--lav)}
.day .off{font-size:11px;line-height:1.3;color:var(--ink-soft);letter-spacing:.1em}
.day.sel .off{color:inherit}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink)}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--rule);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--sage-deep)}
.switch input:checked::after{transform:translateX(16px)}
.restday{padding:34px 20px 30px;text-align:center;border-radius:220px 220px 18px 18px;background:var(--lav);max-width:420px;margin:0 auto;width:100%}
.restday h3{font-size:24px;letter-spacing:.12em;margin-top:6px}
.restday p{margin:6px 0 0;color:var(--ink-soft);font-size:14px}
.restday .row{justify-content:center;margin-top:16px}
.note{font-size:13px;color:var(--ink-soft);margin:12px 0 0;text-align:right}
.note button{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;color:inherit;font-size:13px}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-soft)}
.sw{display:inline-block;width:12px;height:14px;border-radius:6px 6px 2px 2px;background:var(--sage);vertical-align:-2px;margin-right:6px}

/* 食譜卡片 */
.list{display:flex;flex-direction:column}
.rcard{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:14px 2px}
.rcard:hover .rname{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.thumb{flex:none;width:58px;height:70px;border-radius:var(--arch);display:grid;place-items:center;font-size:28px}
.p0{background:var(--blush)}.p1{background:var(--sage)}.p2{background:var(--powder)}.p3{background:var(--butter)}
.rinfo{min-width:0;flex:1}
.rname{font-family:var(--serif);font-size:18px;line-height:1.45;letter-spacing:.04em;display:block}
.rmeta{display:flex;gap:12px;flex-wrap:wrap;margin-top:3px;font-size:13px;color:var(--ink-soft)}
.tag{font-size:12px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-soft);line-height:1.8}
.tag.ic{border-color:var(--blush-deep);color:var(--blush-deep)}
.tag.cp{border-color:var(--sage-deep);color:var(--sage-deep)}
.tag.my{border-color:var(--ink);color:var(--ink)}
.rform .fl{display:block;margin-top:18px;font-size:14px;color:var(--ink-soft);letter-spacing:.04em}
.rform .fl b{font-weight:400;color:var(--blush-deep)}
.rform input,.rform textarea,.rform select{width:100%;border:1px solid var(--rule);border-radius:14px;background:var(--surface);padding:10px 12px;margin-top:6px}
.rform input:focus,.rform textarea:focus,.rform select:focus{outline:none;border-color:var(--ink)}
.rform textarea{min-height:112px;resize:vertical;line-height:1.75}
.rform .three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.rform .hint{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emos button{width:42px;height:48px;border-radius:21px 21px 8px 8px;border:1px solid var(--rule);background:var(--surface);font-size:21px;padding:0}
.emos button[aria-pressed="true"]{background:var(--blush);border-color:var(--blush-deep)}
.form-err{color:var(--blush-deep);font-size:14px;margin:12px 0 0}
.form-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.form-actions .btn{flex:1;padding:12px}
.mine-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.bar{height:3px;background:var(--rule);border-radius:3px;margin-top:8px;max-width:180px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage-deep)}
.arrow{flex:none;color:var(--ink-soft);font-family:var(--latin);font-size:22px}
.empty{padding:28px 18px;text-align:center;color:var(--ink-soft);border:1px dashed var(--rule);border-radius:18px}
.empty .row{justify-content:center;margin-top:12px}
.day-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.day-actions .btn{padding:12px 10px}
.day-actions .full{grid-column:1/-1}

/* ---------- 冰箱 ---------- */
.band{background:var(--sage);padding:40px 0 34px}
.band.blush{background:var(--blush)}
.band h1{font-size:clamp(30px,5vw,46px);letter-spacing:.1em}
.band p{margin:8px 0 0;color:var(--ink-soft);max-width:34em}
.band .kicker{color:var(--sage-deep)}
.fr-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:32px 0 10px}
@media (max-width:760px){.fr-grid{grid-template-columns:1fr}}
.fr{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:24px 20px}
.fr h2{font-size:24px;display:flex;align-items:baseline;gap:10px}
.fr h2 small{font-family:var(--sans);font-size:13px;color:var(--ink-soft);letter-spacing:0}
.adder{display:flex;gap:8px;margin-top:14px}
.adder input,.search input,.search select{flex:1;min-width:0;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 2px;border-radius:0}
.adder input:focus,.search input:focus{outline:none;border-bottom-width:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 14px;border-radius:999px;background:var(--sage);font-size:14.5px}
.pill.s{background:var(--butter)}
.pill button{border:0;background:transparent;width:24px;height:24px;border-radius:50%;font-size:13px;color:var(--ink-soft)}
.pill button:hover{background:var(--surface)}
.sug{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.sug p{margin:0 0 8px;font-size:13px;color:var(--ink-soft)}
.sug button{border:1px dashed var(--ink-soft);background:transparent;border-radius:999px;padding:1px 12px;font-size:13.5px;color:var(--ink-soft)}
.sug button:hover{border-style:solid;color:var(--ink)}
.cta-line{display:flex;justify-content:center;padding:18px 0 40px}

/* ---------- 吃什麼 ---------- */
.pick-hero{background:var(--night);color:var(--night-ink);padding:40px 0 44px;text-align:center}
.pick-hero h1{font-size:clamp(30px,5.5vw,50px);letter-spacing:.1em}
.pick-hero .lede{color:var(--night-soft);margin:8px auto 22px;max-width:28em}
.pot-arch{width:200px;height:230px;margin:0 auto;border-radius:var(--arch);background:var(--blush);display:grid;place-items:end center;overflow:hidden;cursor:pointer;border:0;padding:0}
.pot-arch svg{width:100%;height:100%}
.pot-arch.shake svg{animation:shake .7s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg)}30%{transform:rotate(5deg)}45%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}80%{transform:rotate(-1deg)}}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px auto 10px;max-width:560px}
.f{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--night-ink);border-radius:999px;padding:3px 14px;font-size:14px;letter-spacing:.08em}
.f[aria-pressed="true"]{background:var(--night-ink);color:var(--night);border-color:var(--night-ink)}
.toggles{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;font-size:14px;color:var(--night-soft);margin-bottom:20px}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggles input{width:16px;height:16px;accent-color:var(--blush-deep)}
.result{max-width:520px;margin:26px auto 0;text-align:left;background:var(--paper);color:var(--ink);border-radius:22px;padding:18px 20px;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.result .row{margin-top:14px}
.search{display:flex;gap:16px;margin-bottom:6px}
.search select{flex:none;width:auto;padding-right:6px}
.credit{font-size:13px;color:var(--ink-soft);text-align:center;margin:30px auto 40px;max-width:36em;line-height:1.8}

/* ---------- 詳細面板 ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,26,34,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:26px 26px 0 0;padding:0 22px calc(26px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:26px;max-height:86%}}
.sheet-head{position:sticky;top:0;background:var(--paper);display:flex;align-items:flex-start;gap:12px;padding:20px 0 14px;border-bottom:1px solid var(--rule);z-index:1}
.sheet-head h3{flex:1;font-size:25px;line-height:1.4}
.sheet-head h3 small{display:block;font-family:var(--sans);font-size:13.5px;color:var(--ink-soft);letter-spacing:0;margin-top:2px}
.x{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:transparent;font-size:15px}
.x:hover{border-color:var(--ink)}
.dh{display:flex;gap:16px;align-items:center;margin:18px 0 6px}
.dh .thumb{width:74px;height:90px;font-size:36px}
.sub{font-size:14px;color:var(--ink-soft);margin:0}
.block{margin-top:24px}
.block h4{font-size:18px;letter-spacing:.1em;margin-bottom:6px}
.il{list-style:none;margin:0;padding:0}
.il li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.il .nm{flex:1;min-width:0}
.il .nm small{display:block;color:var(--ink-soft);font-size:12.5px;line-height:1.55}
.qty{color:var(--ink-soft);font-size:14px;white-space:nowrap}
.have,.miss{font-size:12px;padding:0 10px;border-radius:999px;white-space:nowrap;line-height:1.9}
.have{background:var(--sage)}
.miss{background:var(--blush)}
.buy{border:1px solid var(--ink);background:transparent;border-radius:999px;font-size:12.5px;padding:0 11px;line-height:1.9;white-space:nowrap}
.buy:hover{background:var(--ink);color:var(--on-ink)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--rule)}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--latin);font-style:italic;font-size:22px;line-height:1.3;color:var(--blush-deep)}
.tipbox{margin-top:14px;background:var(--butter);border-radius:16px;padding:12px 16px;font-size:15px}
.addrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--rule)}
.addrow input{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:4px 2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stats div{border-radius:16px 16px 10px 10px;padding:12px 8px 10px;text-align:center}
.stats div:nth-child(1){background:var(--powder)}.stats div:nth-child(2){background:var(--blush)}.stats div:nth-child(3){background:var(--butter)}
.stats strong{display:block;font-family:var(--latin);font-size:34px;font-weight:500;line-height:1}
.stats span{font-size:12.5px;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:9px 20px;border-radius:999px;z-index:70;font-size:14.5px;letter-spacing:.04em;animation:rise .2s ease-out;max-width:90%;text-align:center}

/* 插畫小動畫 */

@keyframes steam{0%,100%{opacity:.2;transform:translateY(4px)}50%{opacity:.85;transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<!-- 首頁 -->
<main id="view-home">

      <section>
        <div class="shead"><h2>菜單日曆</h2><span class="num" id="monthLatin"></span></div>
        <div class="cal">
          <div class="cal-head">

        </div>
      </section>
    </div>
  </div>
  <div style="height:48px"></div>
</main>

<!-- 冰箱 -->
<main id="view-fridge" class="hidden">
  <header class="band">
    <div class="wrap">
      <p class="kicker">in the fridge</p>
      <h1>我的冰箱</h1>
      <p>記下家裡現有的食材與調味料，排菜時就知道缺什麼。</p>
    </div>
  </header>
  <div class="wrap">
    <div class="fr-grid">
      <section class="fr">
        <h2>食材<small>肉、菜、蛋、麵、飯</small></h2>

        <div class="pills" id="foodPills"></div>
        <div class="sug" id="foodSug"></div>
      </section>
      <section class="fr">
        <h2>調味料<small>醬油、鹽、各種醬</small></h2>
        <form class="adder" data-kind="season"><input placeholder="輸入調味料，例如蠔油、味醂" aria-label="新增調味料"><button class="btn solid sm" type="submit">放進冰箱</button></form>
        <div class="pills" id="seasonPills"></div>
        <div class="sug" id="seasonSug"></div>
      </section>
    </div>
    <div class="cta-line"><button class="btn soft" id="btnCookFridge">看看冰箱現在能煮什麼</button></div>
  </div>
</main>

<!-- 吃什麼 -->
<main id="view-pick" class="hidden">

      <button class="pot-arch" id="gachaPot" aria-label="搖一搖抽食譜"><svg viewBox="0 0 300 360" aria-hidden="true"><use href="#potOnly"/></svg></button>
      <div class="filters" id="catFilters"></div>
      <div class="toggles">
        <label><input type="checkbox" id="fQuick">20 分鐘內</label>
        <label><input type="checkbox" id="fFridge">優先用冰箱有的</label>

      <button class="btn light solid" id="btnGacha">搖一搖小鍋</button>

  </div>
</main>

  "青蔥":"蔥","蔥花":"蔥","蒜頭":"蒜","蒜粒":"蒜","大蒜":"蒜","蒜瓣":"蒜",

};
const SKIP = new Set(["水"]);
function canon(n){ n=String(n).replace(/[（(].*?[)）]/g,"").trim(); return ALIAS[n]||n; }
function inFridge(name, kind){
  const c = canon(name);
  const pools = kind ? [state.fridge[kind]] : [state.fridge.food, state.fridge.season];
  return pools.some(list=>list.some(f=>{
    const fc = canon(f);
    if(fc===c) return true;
    return fc.length>=2 && (c.includes(fc) || (c.length>=2 && fc.includes(c)));
  }));
}
function matchScore(r){
  const list = r.ing.filter(i=>!SKIP.has(i[0]));
  const have = list.filter(i=>inFridge(i[0])).length;
  return {have, total:list.length, ratio: list.length? have/list.length : 0};
}

const parse = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const md = d=>(d.getMonth()+1)+"/"+d.getDate();
function weekOf(d){const s=addDays(d,-d.getDay());return [...Array(7)].map((_,i)=>addDays(s,i));}

const LS_KEY = "xiaoguo-planner-v1";
function seedState(){
  return {plan:{}, settings:{weekendOff:true}, cookOn:{}, custom:[], fridge:{food:[], season:[]}};
}
function valid(s){return s && typeof s==="object" && s.plan && s.fridge && Array.isArray(s.fridge.food) && Array.isArray(s.fridge.season);}
function normalize(s){ if(!Array.isArray(s.custom)) s.custom=[];  if(!s.settings||typeof s.settings!=="object") s.settings={weekendOff:true}; if(typeof s.settings.weekendOff!=="boolean") s.settings.weekendOff=true; if(!s.cookOn||typeof s.cookOn!=="object") s.cookOn={}; return s; }
let state = normalize((function(){ try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); if(valid(s)) return s; }catch(e){} return seedState(); })());
rebuild();

function isOff(key){ return state.settings.weekendOff && isWeekend(key) && !state.cookOn[key]; }

/* ---------- Firebase 雲端同步 ---------- */
const FB_VER = "10.12.2";
let fb = null, fbUser = null, cloudRef = null, unsub = null, pushTimer = null, cloud = {s:"noconfig", err:""};
function hasConfig(){ const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey && c.projectId && c.appId); }
function setCloud(s, err){ cloud = {s, err:err||""}; const b=document.getElementById("acctBtn"); if(!b) return;
  b.dataset.s = s;
  b.textContent = s==="synced"&&fbUser ? ((fbUser.displayName||fbUser.email||"我").trim().charAt(0).toUpperCase()) : "☁";
  b.setAttribute("aria-label", {noconfig:"雲端同步尚未設定",signedout:"登入以同步",syncing:"同步中",synced:"已同步",error:"同步出錯"}[s]||"雲端同步");
  if(sheetCtx && sheetCtx.type==="cloud") openCloud();
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("無法載入 "+src)); document.head.appendChild(s); }); }
// Firestore 不支援「陣列裡的陣列」，所以食材存成 {n,q} 物件
function encodeState(){
  const c = JSON.parse(JSON.stringify({plan:state.plan, fridge:state.fridge, settings:state.settings, cookOn:state.cookOn, custom:state.custom}));
  c.custom = c.custom.map(r=>({...r, ing:r.ing.map(([n,q])=>({n,q})), sea:r.sea.map(([n,q])=>({n,q}))}));
  return c;
}
function decodeState(d){
  const pairs = a => Array.isArray(a) ? a.map(x=>Array.isArray(x)?x:[String(x.n||""),String(x.q||"")]) : [];
  const s = {plan:d.plan||{}, fridge:d.fridge||{food:[],season:[]}, settings:d.settings, cookOn:d.cookOn, custom:(d.custom||[]).map(r=>({...r, ing:pairs(r.ing), sea:pairs(r.sea), st:Array.isArray(r.st)?r.st:[]}))};
  s.fridge.food = s.fridge.food||[]; s.fridge.season = s.fridge.season||[];
  return normalize(JSON.parse(JSON.stringify(s)));
}
function mergeStates(a, b){ // a = 雲端, b = 這台裝置
  const out = JSON.parse(JSON.stringify(a));
  Object.entries(b.plan||{}).forEach(([k,ids])=>{ const set=new Set(out.plan[k]||[]); ids.forEach(i=>set.add(i)); out.plan[k]=[...set]; });
  ["food","season"].forEach(kind=>(b.fridge[kind]||[]).forEach(f=>{ if(!out.fridge[kind].includes(f)) out.fridge[kind].push(f); }));
  Object.keys(b.cookOn||{}).forEach(k=>{ out.cookOn[k]=true; });
  const ids = new Set(out.custom.map(r=>r.id)); (b.custom||[]).forEach(r=>{ if(!ids.has(r.id)) out.custom.push(r); });
  return out;
}
function applyState(next){
  state = next; saveLocal(); rebuild(); renderAll();
  if(sheetCtx && (sheetCtx.type==="recipe"||sheetCtx.type==="needs")) refreshSheet();
}
async function pushNow(){
  if(!cloudRef) return;
  setCloud("syncing");
  try{ await cloudRef.set({...encodeState(), updatedAt: firebase.firestore.FieldValue.serverTimestamp()}); setCloud("synced"); }
  catch(e){ console.error(e); setCloud("error", e.code||e.message); }
}
function queuePush(){ if(!cloudRef) return; clearTimeout(pushTimer); setCloud("syncing"); pushTimer = setTimeout(pushNow, 600); }
function startSync(u){
  cloudRef = fb.db.collection("users").doc(u.uid);
  const mergedKey = "xiaoguo-merged-" + u.uid;
  let first = true;
  setCloud("syncing");
  unsub = cloudRef.onSnapshot(async snap=>{
    if(snap.metadata.hasPendingWrites) return;
    if(first && snap.metadata.fromCache) return; // 等拿到雲端真正的資料再決定，避免離線時蓋掉雲端
    const data = snap.exists ? snap.data() : null;
    if(first){
      first = false;
      let merged = false; try{ merged = localStorage.getItem(mergedKey)==="1"; }catch(e){}
      if(!data){ await pushNow(); try{localStorage.setItem(mergedKey,"1");}catch(e){} toast("已把這台裝置的資料存到雲端"); return; }
      if(!merged){
        applyState(mergeStates(decodeState(data), state));
        try{ localStorage.setItem(mergedKey,"1"); }catch(e){}
        await pushNow(); toast("已和雲端資料合併"); return;
      }
    }
    if(data){ clearTimeout(pushTimer); applyState(decodeState(data)); }
    setCloud("synced");
  }, err=>{ console.error(err); setCloud("error", err.code||err.message); });
}
async function initFirebase(){
  if(!hasConfig()){ setCloud("noconfig"); return; }
  try{
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    await loadScript(base+"firebase-app-compat.js");
    await Promise.all([loadScript(base+"firebase-auth-compat.js"), loadScript(base+"firebase-firestore-compat.js")]);
    firebase.initializeApp(window.FIREBASE_CONFIG);
    fb = {auth: firebase.auth(), db: firebase.firestore()};
    setCloud("signedout");
    fb.auth.getRedirectResult().catch(e=>{ if(e && e.code) setCloud("error", e.code); });
    fb.auth.onAuthStateChanged(u=>{
      if(unsub){ unsub(); unsub=null; } cloudRef = null; fbUser = u;
      if(u) startSync(u); else setCloud("signedout");
    });
  }catch(e){ console.error(e); setCloud("error", e.message); }
}
async function signIn(){
  if(!fb) return;
  const provider = new firebase.auth.GoogleAuthProvider();
  try{ await fb.auth.signInWithPopup(provider); }
  catch(e){
    if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)){ try{ await fb.auth.signInWithRedirect(provider); }catch(e2){ setCloud("error", e2.code); } }
    else if(e.code!=="auth/popup-closed-by-user") setCloud("error", e.code||e.message);
  }
}
const ERR_HINT = {

  "permission-denied":"Firestore 的安全規則沒設好，請照說明貼上規則並發布。",

  "auth/configuration-not-found":"Authentication 還沒啟用。到 Firebase 主控台的 Authentication 按「開始使用」。",
  "auth/invalid-api-key":"FIREBASE_CONFIG 的 apiKey 貼錯了，請重新複製。",
  "failed-precondition":"Firestore 資料庫還沒建立。到 Firestore Database 按「建立資料庫」。",

function openCloud(){
  const wasOpen = sheetCtx && sheetCtx.type==="cloud";
  sheetCtx = {type:"cloud"};
  const s = cloud.s; let body = "";
  if(s==="noconfig") body = `<div class="cloud-card"><p>雲端同步還沒設定好。</p><p class="sub">要先在 Firebase 建立專案，把設定貼到 <code>index.html</code> 最上方的 <code>FIREBASE_CONFIG</code>。在那之前，資料只存在這台裝置的瀏覽器裡。</p></div>`;
  else if(s==="signedout") body = `<div class="cloud-card"><p>用 Google 帳號登入後，電腦和手機會自動同步菜單、冰箱和你新增的食譜。</p><p class="sub">第一次登入時，這台裝置上已有的資料會和雲端合併，不會被洗掉。</p><button class="btn solid gbtn" data-signin="1"><b style="font-family:var(--latin);font-size:18px">G</b>用 Google 登入</button></div>`;
  else if(s==="error") body = `<div class="cloud-card"><p>同步出了點問題。</p><p class="sub">${esc(ERR_HINT[cloud.err]||("錯誤代碼："+cloud.err))}</p><div class="row">${fbUser?`<button class="btn sm" data-signout="1">登出</button>`:`<button class="btn solid sm" data-signin="1">重新登入</button>`}</div></div>`;
  else body = `<div class="cloud-card"><p>${s==="syncing"?"同步中…":"✓ 已同步"}</p><p class="sub">登入帳號：${esc(fbUser?(fbUser.email||fbUser.displayName||""):"")}<br>在任何裝置用同一個 Google 帳號登入，資料都會自動更新。</p><button class="btn sm" data-signout="1">登出</button></div>`;
  const html = `<div class="sheet-head"><h3 id="sheetTitle">雲端同步<small>電腦、手機看到同一份資料</small></h3><button class="x" data-close aria-label="關閉">✕</button></div>${body}`;
  if(wasOpen) $("#sheet").innerHTML = html; else { openSheet("",""); $("#sheet").innerHTML = html; sheetCtx = {type:"cloud"}; }
}

function renderCalendar(){
  $("#monthTitle").textContent = viewMonth.getFullYear()+" 年 "+(viewMonth.getMonth()+1)+" 月";
  $("#monthLatin").textContent = MON[viewMonth.getMonth()];
  let html = WD.map(w=>`<div class="dow">${w}</div>`).join("");
  const start = addDays(viewMonth, -viewMonth.getDay());
  const selWeek = new Set(weekOf(selected).map(ymd));
  const tk = ymd(TODAY), sk = ymd(selected);
  for(let i=0;i<42;i++){
    const d = addDays(start,i), k = ymd(d);
    if(i===35 && d.getMonth()!==viewMonth.getMonth()) break;
    const ids = dayPlan(k);
    const emo = ids.slice(0,2).map(id=>BY_ID[id]?BY_ID[id].e:"").join("") + (ids.length>2?"+":"");
    const cls = ["day", d.getMonth()!==viewMonth.getMonth()?"out":"", selWeek.has(k)&&k!==sk?"wk":"", k===tk?"today":"", k===sk?"sel":""].join(" ");
    const off = isOff(k);
    html += `<button class="${cls}" data-date="${k}" aria-pressed="${k===sk}" aria-label="${d.getMonth()+1}月${d.getDate()}日${off?"，休假":ids.length?`，${ids.length} 道菜`:""}"><span class="n">${d.getDate()}</span>${off?`<span class="off">休</span>`:`<span class="e">${emo}</span>`}</button>`;
  }
  $("#calGrid").innerHTML = html;
  $("#weekendOff").checked = state.settings.weekendOff;
}

function renderFridge(){
  ["food","season"].forEach(kind=>{
    const items = state.fridge[kind];
    $(kind==="food"?"#foodPills":"#seasonPills").innerHTML = items.length
      ? items.map((f,i)=>`<span class="pill ${kind==="season"?"s":""}">${esc(f)}<button data-del="${kind}:${i}" aria-label="移除${esc(f)}">✕</button></span>`).join("")
      : `<span class="sub">還空空的，先放幾樣進來吧。</span>`;
    const freq = {};
    ALL.forEach(r=>(kind==="food"?r.ing:r.sea).forEach(([n])=>{ if(SKIP.has(n)) return; const c=canon(n); freq[c]=(freq[c]||0)+1; }));
    const sug = Object.entries(freq).filter(([n])=>!inFridge(n,kind)).sort((a,b)=>b[1]-a[1]).slice(0,10);
    $(kind==="food"?"#foodSug":"#seasonSug").innerHTML = sug.length ? `<p>快煮鍋食譜常用到</p><div class="row" style="gap:6px">${sug.map(([n])=>`<button data-sug="${kind}:${esc(n)}">＋ ${esc(n)}</button>`).join("")}</div>` : "";
  });
}
function addFridge(kind, name){
  name = String(name).trim(); if(!name) return false;
  if(state.fridge[kind].includes(name)){ toast(`${name} 已經在冰箱裡`); return false; }
  state.fridge[kind].push(name); persist(); return true;
}

function gacha(){
  let pool = ALL.filter(r=>(activeCats.size===0||activeCats.has(r.c)) && (!$("#fQuick").checked || r.t<=20));
  if(!pool.length){ $("#gachaResult").innerHTML = `<div class="result"><p class="sub">這個條件抽不到，少選一個條件再試一次。</p></div>`; return; }
  if(pool.length>1 && lastPick) pool = pool.filter(r=>r.id!==lastPick);
  let r;
  if($("#fFridge").checked){
    const w = pool.map(x=>0.15+matchScore(x).ratio*3); let t=Math.random()*w.reduce((a,b)=>a+b,0);
    r = pool[pool.length-1]; for(let i=0;i<pool.length;i++){ t-=w[i]; if(t<=0){ r=pool[i]; break; } }
  }else r = pool[Math.floor(Math.random()*pool.length)];
  lastPick = r.id;
  const pot = $("#gachaPot"); pot.classList.remove("shake"); void pot.offsetWidth; pot.classList.add("shake");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const where = ymd(selected)===ymd(TODAY) ? "今天" : md(selected);
  setTimeout(()=>{
    const m = matchScore(r);
    $("#gachaResult").innerHTML = `<div class="result">

  }, reduce?0:650);
}

function aggregate(keys){
  const out = {food:new Map(), season:new Map()}; let dishes=0;
  keys.filter(k=>!isOff(k)).forEach(k=>dayPlan(k).forEach(id=>{
    const r=BY_ID[id]; if(!r) return; dishes++;
    [["food",r.ing],["season",r.sea]].forEach(([kind,list])=>list.forEach(([n,q])=>{
      if(SKIP.has(n)) return; const c=canon(n);
      if(!out[kind].has(c)) out[kind].set(c,{name:c,uses:[]});
      out[kind].get(c).uses.push({q, r:r.n, d:k});
    }));
  }));
  return {out, dishes};
}
function needsRows(map, kind, multi){
  const rows = [...map.values()].map(x=>({...x, have:inFridge(x.name,kind)})).sort((a,b)=>(a.have-b.have)||b.uses.length-a.uses.length);
  if(!rows.length) return `<li><span class="nm sub">不需要${kind==="food"?"食材":"調味料"}</span></li>`;
  return rows.map(x=>`<li><span class="nm">${esc(x.name)}${x.uses.length>1?`<span class="tag" style="margin-left:8px">${x.uses.length} 道用到</span>`:""}<small>${x.uses.map(u=>`${esc(u.q)}，${esc(u.r)}${multi?`（${md(parse(u.d))}）`:""}`).join("；")}</small></span>${x.have?`<span class="have">冰箱有</span>`:`<button class="buy" data-buy="${kind}:${esc(x.name)}">買好了</button>`}</li>`).join("");
}
function openNeeds(mode){
  const keys = mode==="week" ? weekOf(selected).map(ymd) : [ymd(selected)];
  sheetCtx = {type:"needs", mode};
  const {out, dishes} = aggregate(keys); const wk = weekOf(selected);
  const title = mode==="week" ? `本週所需食材<small>${md(wk[0])}（日）到 ${md(wk[6])}（六）</small>`
    : (ymd(selected)===ymd(TODAY) ? "今日所需食材" : `${md(selected)} 所需食材`) + `<small>星期${WD[selected.getDay()]}</small>`;
  if(!dishes){ openSheet(title, `<div class="empty" style="margin-top:20px">${mode==="day"&&isOff(keys[0])?"這天是休假日，不用買菜。":(mode==="week"?"這週":"這天")+"還沒排任何菜。"}<div class="row"><button class="btn solid sm" data-add="1">＋ 加一道</button></div></div>`); return; }
  const missF=[...out.food.values()].filter(x=>!inFridge(x.name,"food")), missS=[...out.season.values()].filter(x=>!inFridge(x.name,"season"));
  const dishes_html = mode==="week"
    ? `<ul class="il">${keys.map(k=>{const ids=dayPlan(k);return `<li><span class="nm">${md(parse(k))}（${WD[parse(k).getDay()]}）<small>${isOff(k)?"🌿 休假，不開伙":ids.length?ids.map(id=>BY_ID[id]?esc(BY_ID[id].e+" "+BY_ID[id].n):"").join("、"):"還沒排"}</small></span></li>`;}).join("")}</ul>`
    : `<div class="list">${dayPlan(keys[0]).map(id=>BY_ID[id]).filter(Boolean).map(r=>rcardHTML(r)).join("")}</div>`;
  openSheet(title, `
    <div class="stats"><div><strong>${dishes}</strong><span>道菜</span></div><div><strong>${missF.length}</strong><span>樣食材要買</span></div><div><strong>${missS.length}</strong><span>樣調味料要買</span></div></div>
    ${(missF.length||missS.length)?`<div class="row" style="margin-top:14px"><button class="btn sm" id="copyList">複製購物清單</button></div>`:`<p class="sub" style="margin-top:12px">冰箱全都有，可以直接開煮。</p>`}
    <div class="block"><h4>食材</h4><ul class="il">${needsRows(out.food,"food",mode==="week")}</ul></div>
    <div class="block"><h4>調味料</h4><ul class="il">${needsRows(out.season,"season",mode==="week")}</ul></div>
    <div class="block"><h4>${mode==="week"?"這週的菜":"這天的菜"}</h4>${dishes_html}</div>`);
  const cp = $("#copyList");
  if(cp) cp.onclick = async ()=>{
    const text = (mode==="week"?"本週":md(selected))+"購物清單\n"+(missF.length?"【食材】\n"+missF.map(x=>"・"+x.name).join("\n")+"\n":"")+(missS.length?"【調味料】\n"+missS.map(x=>"・"+x.name).join("\n"):"");
    try{ await navigator.clipboard.writeText(text); toast("購物清單已複製"); }catch(e){ toast("無法複製，請手動記下清單"); }
  };
}
function openPicker(){
  sheetCtx = {type:"picker"};
  openSheet(`加一道菜<small>${md(selected)}（${WD[selected.getDay()]}）</small>`, `<div class="row" style="margin-top:14px"><button class="btn soft sm" data-newrecipe="picker">＋ 找不到？自己新增一道</button></div><div class="search" style="margin-top:10px"><input id="pkSearch" type="search" placeholder="搜尋菜名或食材" aria-label="搜尋"></div><div class="list" id="pkList"></div>`);
  const draw = ()=>{
    const q = $("#pkSearch").value.trim();
    const list = ALL.filter(r=>!q||r.n.includes(q)||r.ing.some(i=>i[0].includes(q))).sort((a,b)=>matchScore(b).ratio-matchScore(a).ratio);
    $("#pkList").innerHTML = list.map(r=>rcardHTML(r,true,"data-pickadd")).join("") || `<div class="empty">找不到「${esc(q)}」</div>`;
  };
  $("#pkSearch").addEventListener("input", draw); draw();
}
function linesToPairs(text){
  return String(text||"").split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.match(/^(.+?)[\s:：,，]+(.+)$/);
    return m ? [m[1].trim().slice(0,30), m[2].trim().slice(0,30)] : [l.slice(0,30), "適量"];
  });
}
const pairsToLines = list=>list.map(([n,q])=>n+" "+q).join("\n");
function openRecipeForm(editId, fromPicker){
  const r = editId ? BY_ID[editId] : null;
  sheetCtx = {type:"form"};
  const emo = r ? r.e : EMOS[0];
  openSheet(r ? "編輯食譜<small>改完按儲存</small>" : "新增食譜<small>寫下你自己的快煮鍋料理</small>", `
    <form class="rform" id="rform" novalidate>
      <label class="fl" for="fName">菜名 <b>*</b></label>
      <input id="fName" maxlength="40" required placeholder="例如：番茄蛋花湯" value="${r?esc(r.n):""}">
      <span class="fl">小圖示</span>
      <div class="emos" role="group" aria-label="選一個小圖示">${EMOS.map(e=>`<button type="button" data-emo="${e}" aria-pressed="${e===emo}">${e}</button>`).join("")}</div>
      <input type="hidden" id="fEmo" value="${esc(emo)}">
      <div class="three">
        <div><label class="fl" for="fCat">分類</label><select id="fCat">${CATS.map(c=>`<option ${r&&r.c===c?"selected":""}>${c}</option>`).join("")}</select></div>
        <div><label class="fl" for="fTime">時間（分鐘）</label><input id="fTime" type="number" min="1" max="600" inputmode="numeric" value="${r?r.t:20}"></div>
        <div><label class="fl" for="fServ">份量</label><input id="fServ" maxlength="20" value="${r?esc(r.sv):"1人份"}"></div>
      </div>
      <label class="fl" for="fIng">食材 <b>*</b></label>
      <textarea id="fIng" placeholder="雞蛋 2顆&#10;番茄 1顆&#10;蔥 1支">${r?esc(pairsToLines(r.ing)):""}</textarea>
      <span class="hint">每行一樣，名稱和份量中間空一格；沒寫份量會顯示「適量」</span>
      <label class="fl" for="fSea">調味料</label>
      <textarea id="fSea" placeholder="鹽 少許&#10;香油 幾滴&#10;水 400ml">${r?esc(pairsToLines(r.sea)):""}</textarea>
      <label class="fl" for="fSteps">做法</label>
      <textarea id="fSteps" placeholder="番茄切塊，蛋打散&#10;水煮滾後放番茄煮 5 分鐘&#10;淋入蛋液，加鹽調味">${r?esc(r.st.join("\n")):""}</textarea>
      <span class="hint">每行一個步驟，會自動編號</span>
      <label class="fl" for="fTip">小訣竅（選填）</label>
      <input id="fTip" maxlength="80" value="${r&&r.tip?esc(r.tip):""}">
      <label class="fl" for="fUrl">參考連結（選填）</label>
      <input id="fUrl" type="url" placeholder="https://" value="${r&&r.u?esc(r.u):""}">
      <p class="form-err" id="fErr" role="alert"></p>
      <div class="form-actions"><button class="btn" type="button" data-close>取消</button><button class="btn solid" type="submit">${r?"儲存修改":"儲存食譜"}</button></div>
    </form>`);
  $("#rform").addEventListener("submit", e=>{
    e.preventDefault();
    const name = $("#fName").value.trim(), ing = linesToPairs($("#fIng").value);
    if(!name){ $("#fErr").textContent="請填菜名"; $("#fName").focus(); return; }
    if(!ing.length){ $("#fErr").textContent="至少寫一樣食材"; $("#fIng").focus(); return; }
    let url = $("#fUrl").value.trim(); if(url && !/^https?:\/\//i.test(url)) url = "https://"+url;
    const t = Math.min(600, Math.max(1, parseInt($("#fTime").value,10)||20));
    const rec = {id: r ? r.id : "my"+Date.now().toString(36), n:name, o:name, s:"my", u:url, a:"我", t,
      sv:$("#fServ").value.trim()||"1人份", c:$("#fCat").value, e:$("#fEmo").value||EMOS[0], ing, sea:linesToPairs($("#fSea").value),
      st:$("#fSteps").value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,30), tip:$("#fTip").value.trim()};
    if(r){ state.custom = state.custom.map(x=>x.id===r.id?rec:x); }
    else state.custom.push(rec);
    persist(); rebuild(); renderAll();
    if(fromPicker && !r){ addToPlan(ymd(selected), rec.id); closeSheet(); return; }
    toast(r?"食譜已更新":"新食譜已加入"); openRecipe(rec.id, null);
  });
  setTimeout(()=>{ if(!r) $("#fName").focus(); },60);
}
function deleteRecipe(id){
  state.custom = state.custom.filter(x=>x.id!==id);
  Object.keys(state.plan).forEach(k=>{ state.plan[k]=state.plan[k].filter(x=>x!==id); if(!state.plan[k].length) delete state.plan[k]; });
  persist(); rebuild(); closeSheet(); renderAll(); toast("食譜已刪除");
}
function refreshSheet(){ if(!sheetCtx) return; if(sheetCtx.type==="needs") openNeeds(sheetCtx.mode); else if(sheetCtx.type==="recipe") openRecipe(sheetCtx.id, sheetCtx.fromDate); }
function addToPlan(key, id){
  const arr = state.plan[key] ? [...state.plan[key]] : [];
  if(arr.includes(id)){ toast("這天已經有這道菜了"); return; }
  const wasOff = isOff(key); if(wasOff) state.cookOn[key]=true;
  arr.push(id); state.plan[key]=arr; persist(); toast(wasOff?`${md(parse(key))} 原本休假，已改成要開伙`:`已把 ${BY_ID[id].n} 排進 ${md(parse(key))}`); renderAll();
}

function show(view){
  ["home","fridge","pick"].forEach(v=>$("#view-"+v).classList.toggle("hidden", v!==view));
  document.querySelectorAll(".links button").forEach(b=>b.dataset.view===view?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  if(view==="pick") renderLib(); if(view==="fridge") renderFridge();
  window.scrollTo(0,0);
}
function renderAll(){ renderToday(); renderCalendar(); renderDay(); renderFridge(); renderCatFilters(); renderLib(); }

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(t.id==="acctBtn") return openCloud();
  if(d.signin) return signIn();
  if(d.signout){ if(fb) fb.auth.signOut(); toast("已登出，資料仍保留在這台裝置"); return; }
  if(d.emo){ document.querySelectorAll(".emos button").forEach(b=>b.setAttribute("aria-pressed", b===t)); $("#fEmo").value=d.emo; return; }
  if(d.newrecipe) return openRecipeForm(null, d.newrecipe==="picker");
  if(d.editrecipe) return openRecipeForm(d.editrecipe);
  if(d.delrecipe){ if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="再按一次確認刪除"; t.classList.add("solid"); return; } return deleteRecipe(d.delrecipe); }
  if(d.view) return show(d.view);
  if(d.goto){ closeSheet(); return show(d.goto); }
  if(d.date){ selected=parse(d.date); if(selected.getMonth()!==viewMonth.getMonth()) viewMonth=new Date(selected.getFullYear(),selected.getMonth(),1); renderCalendar(); renderDay(); return; }
  if(d.cookon){ state.cookOn[d.cookon]=true; persist(); toast("這天改成要開伙"); renderAll(); return; }
  if(d.cookoff){ delete state.cookOn[d.cookoff]; persist(); toast("已改回休假"); renderAll(); return; }
  if(d.openToday) return openRecipe(d.openToday, ymd(TODAY));
  if(d.open){ const fromDay = t.closest("#menuList"); return openRecipe(d.open, fromDay?ymd(selected):null); }
  if(d.pickadd){ addToPlan(ymd(selected), d.pickadd); closeSheet(); return; }
  if(d.add){ closeSheet(); return openPicker(); }
  if(d.plan) return addToPlan(ymd(selected), d.plan);
  if(d.planDate){ const v=$("#addDate").value; if(!v) return toast("先選一個日期"); addToPlan(v, d.planDate); sheetCtx.fromDate=v; refreshSheet(); return; }
  if(d.remove){ const [k,id]=d.remove.split(":"); state.plan[k]=dayPlan(k).filter(x=>x!==id); if(!state.plan[k].length) delete state.plan[k]; persist(); toast("已從菜單移除"); closeSheet(); renderAll(); return; }
  if(d.buy){ const i=d.buy.indexOf(":"), kind=d.buy.slice(0,i), n=d.buy.slice(i+1); if(addFridge(kind,n)) toast(`${n} 放進冰箱了`); renderFridge(); renderLib(); refreshSheet(); return; }
  if(d.del){ const [kind,i]=d.del.split(":"); state.fridge[kind].splice(Number(i),1); persist(); renderFridge(); renderLib(); return; }
  if(d.sug){ const i=d.sug.indexOf(":"); if(addFridge(d.sug.slice(0,i), d.sug.slice(i+1))){ renderFridge(); renderLib(); } return; }
  if(d.cat!==undefined){ if(d.cat==="") activeCats.clear(); else activeCats.has(d.cat)?activeCats.delete(d.cat):activeCats.add(d.cat); renderCatFilters(); return; }
  if("close" in d) return closeSheet();
  if(t.id==="again"||t.id==="btnGacha"||t.id==="gachaPot") return gacha();
});
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#overlay").classList.contains("hidden")) closeSheet(); });
$("#prevM").onclick=()=>{ viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1); renderCalendar(); };
$("#nextM").onclick=()=>{ viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1); renderCalendar(); };
$("#goToday").onclick=()=>{ selected=new Date(TODAY); viewMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1); renderCalendar(); renderDay(); };
$("#weekendOff").addEventListener("change", e=>{ state.settings.weekendOff=e.target.checked; persist(); toast(e.target.checked?"週末自動休假已開啟":"週末自動休假已關閉"); renderAll(); });
$("#btnDayNeeds").onclick=()=>openNeeds("day");
$("#btnWeekNeeds").onclick=()=>openNeeds("week");
$("#btnAddDish").onclick=openPicker;
$("#btnCookFridge").onclick=()=>{ $("#libSort").value="fridge"; show("pick"); setTimeout(()=>$("#libList").scrollIntoView({behavior:"smooth",block:"start"}),60); };
document.querySelectorAll(".adder").forEach(f=>f.addEventListener("submit", e=>{
  e.preventDefault(); const inp=f.querySelector("input");
  inp.value.split(/[,，、\s]+/).forEach(v=>addFridge(f.dataset.kind, v)); inp.value=""; renderFridge(); renderLib();
}));
$("#libSearch").addEventListener("input", renderLib);
$("#libSort").addEventListener("change", renderLib);

renderAll();
initFirebase();
})();
</script>
</body>
</html>
